<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>مسار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=El+Messiri:wght@600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=block">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<style>
/* ===================== نظام التصميم ===================== */
:root{
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
  --r1:10px;--r2:14px;--r3:20px;--rp:999px;
  --fs-xs:11.5px;--fs-sm:13px;--fs-md:14.5px;--fs-lg:17px;--fs-xl:22px;--fs-num:34px;
  --font:'IBM Plex Sans Arabic','Segoe UI',Tahoma,system-ui,sans-serif;
  --font-display:'El Messiri','IBM Plex Sans Arabic',sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
body.light{
  --glass:rgba(251,247,238,.94);--solid:#FBF7EE;--ink:#2B1E3F;--muted:#6a5d82;
  --line:rgba(43,30,63,.14);--line2:rgba(43,30,63,.26);--brand:#5B3F8F;--on-brand:#fff;
  --brand-soft:#ECE4F5;--accent:#C8922F;--gold:#D9A848;--red:#C0392B;--route:#5B3F8F;--chip:#EDE5F4;
  --shadow:0 1px 2px rgba(43,30,63,.10),0 14px 34px -14px rgba(50,35,80,.42);
  --map-filter:saturate(.6) brightness(1.03);--ring:rgba(91,63,143,.10);--ringline:rgba(91,63,143,.55);
  --logo-ink:#2B1E3F;--logo-mid:#5B3F8F;--logo-top:#F5EEE2;--logo-pin:#5B3F8F;
}
body.dark{
  --glass:rgba(33,24,54,.92);--solid:#2A2040;--ink:#F5EEE2;--muted:#b5a8cf;
  --line:rgba(245,238,226,.13);--line2:rgba(245,238,226,.24);--brand:#B9A3DC;--on-brand:#2B1E3F;
  --brand-soft:#3A2C5A;--accent:#D9A848;--gold:#D9A848;--red:#d1493c;--route:#D9A848;--chip:#382B52;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 16px 38px -14px rgba(0,0,0,.85);
  --map-filter:invert(1) hue-rotate(180deg) brightness(.80) contrast(.92) saturate(.45) sepia(.12);--ring:rgba(217,168,72,.10);--ringline:rgba(217,168,72,.6);
  --logo-ink:#F5EEE2;--logo-mid:#D9A848;--logo-top:#2B1E3F;--logo-pin:#D9A848;
}
.sadu{height:9px;background:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='16'%20height='10'%20viewBox='0%200%2016%2010'%3E%3Crect%20width='16'%20height='10'%20fill='%235B3F8F'/%3E%3Cpath%20d='M0%2010%20L4%202%20L8%2010%20Z'%20fill='%23F5EEE2'/%3E%3Cpath%20d='M8%2010%20L12%202%20L16%2010%20Z'%20fill='%232B1E3F'/%3E%3C/svg%3E") repeat-x left center/auto 9px}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);background:#e9e2ee;-webkit-font-smoothing:antialiased}
body.dark{background:#1E1630}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ms-svg{display:inline-grid;place-items:center;width:1em;height:1em;font-size:24px;vertical-align:middle}.ms-svg .kaaba{width:100%;height:100%;display:block}
.pin .ms-svg{font-size:20px}.pin.big .ms-svg{font-size:30px}.cbtn .ms-svg{font-size:25px}.pill .ms-svg{font-size:20px}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';-webkit-font-smoothing:antialiased;font-size:22px;user-select:none}
.fill{font-variation-settings:'FILL' 1}
#map{position:absolute;inset:0;background:inherit;z-index:0;direction:ltr}
.leaflet-tile-pane .osm{filter:var(--map-filter)}
.leaflet-container{font-family:var(--font);background:inherit}
.leaflet-control-attribution{display:none}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border:1px solid var(--line);box-shadow:var(--shadow)}
.ui>*{position:absolute;z-index:500}
.ic-btn{width:44px;height:44px;border-radius:var(--r2);display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .15s}
.ic-btn:hover{background:var(--brand-soft);color:var(--brand)}
.ic-btn:active{transform:scale(.94)}
.ic-btn:focus-visible,.pill:focus-visible,.cbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- الهوية (أعلى اليمين) ---------- */
.brand{overflow:hidden;top:20px;right:24px;display:flex;align-items:center;gap:12px;padding:8px 14px 8px 16px;border-radius:var(--r3)}
.brand .mk{width:48px;height:48px;border-radius:14px;background:#5B3F8F;display:grid;place-items:center;flex:none;box-shadow:0 4px 12px -4px rgba(43,30,63,.5)}
.brand .mk svg{width:38px;height:38px}
.brand .nm{font-family:var(--font-display);font-weight:700;font-size:32px;line-height:1;color:var(--brand)}
body.dark .brand .nm{color:var(--gold)}
.brand .tg{font-size:var(--fs-xs);color:var(--muted);margin-top:3px}

/* ---------- البحث ---------- */
.searchbar{top:18px;left:50%;transform:translateX(-50%);width:min(780px,calc(100% - 720px));min-width:420px;height:72px;border-radius:var(--r3);display:flex;align-items:center;gap:var(--s2);padding:0 var(--s2)}
.searchbar .spark{color:var(--brand);width:54px;height:54px;display:grid;place-items:center;flex:none;background:var(--brand-soft);border-radius:var(--r2)}
.searchbar input{flex:1;min-width:0;height:100%;background:none;border:0;outline:0;font:600 19px/1.2 var(--font);color:var(--ink);padding:0 var(--s2)}
.searchbar input::placeholder{color:var(--ink);opacity:.62;font-weight:500}
.locchip{display:flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:var(--rp);background:var(--chip);color:var(--muted);font-size:var(--fs-xs);white-space:nowrap;border:1px solid var(--line)}
.locchip .ms{font-size:17px;color:var(--brand)}
.locchip.off .ms{color:#dc2626}
.go{width:56px;height:56px;border-radius:var(--r2);background:var(--brand);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s,filter .15s}
.go:hover{filter:brightness(1.08)}.go:active{transform:scale(.94)}
body.dark .go{background:#7D5BB5;color:#fff}
.go.busy .ms{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- أعلى اليسار: الطقس والصلاة والمظهر ---------- */
.infochips{top:78px;left:24px;display:flex;gap:var(--s2)}
.topleft{top:20px;left:24px;display:flex;align-items:center;gap:var(--s2)}
.chipinfo{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:var(--r2);font-size:var(--fs-sm);font-weight:600;white-space:nowrap}
.chipinfo .ms{font-size:20px;color:var(--accent)}
.chipinfo small{display:block;color:var(--muted);font-weight:400;font-size:10.5px;line-height:1.1}
.chipinfo b{display:block;line-height:1.1}
.ui>.infochips{z-index:520}
#wxchip{cursor:pointer;position:relative}
.advpop{position:absolute;top:calc(100% + 8px);inset-inline-start:0;width:260px;padding:12px;border-radius:var(--r2);background:var(--solid);color:var(--ink);box-shadow:var(--shadow);white-space:normal;z-index:40;font-weight:500;font-size:13px;line-height:1.7;cursor:default}
.advpop .at{font-weight:700;color:var(--brand);margin-bottom:4px;font-size:12px}
.advpop .ab{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.advpop .ab button{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;border-radius:16px;background:var(--brand-soft);color:var(--brand);font:600 12.5px var(--font)}
.advpop .ab .ms{font-size:16px;color:inherit}
body.dark .advpop .at,body.dark .advpop .ab button{color:var(--gold)}

.themesw{width:44px;height:44px;border-radius:50%;position:relative;overflow:hidden;border:1px solid var(--line2);box-shadow:var(--shadow);display:grid;place-items:center;transition:background .5s,transform .2s}
.themesw:active{transform:scale(.92)}
body.light .themesw{background:linear-gradient(160deg,#fff4cf,#ffe08a);color:#B7791F}
body.dark .themesw{background:linear-gradient(160deg,#1E1630,#3a2c5a);color:#D9A848}
.themesw .ms{position:absolute;font-size:24px;transition:transform .5s var(--ease),opacity .3s}
body.light .themesw .m{transform:rotate(-90deg) scale(.4);opacity:0}
body.dark .themesw .s{transform:rotate(90deg) scale(.4);opacity:0}
.helpbtn{height:44px;padding:0 16px;border-radius:var(--rp);display:flex;align-items:center;gap:6px;font-weight:600;font-size:var(--fs-sm);color:var(--ink)}
.helpbtn .ms{color:var(--accent);font-size:20px}
.helpbtn.pulse{animation:ring 1.6s ease-out infinite,nudge 3.2s ease-in-out infinite;position:relative}
.helpbtn.pulse::after{content:'';position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--solid);animation:blink 1.1s ease-in-out infinite}
@keyframes nudge{0%,80%,100%{transform:none}86%{transform:scale(1.07)}92%{transform:scale(.98)}}
@keyframes blink{50%{opacity:.25;transform:scale(.8)}}
body.light .helpbtn.pulse{animation-name:ring2,nudge}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(217,168,72,.7)}100%{box-shadow:0 0 0 16px rgba(217,168,72,0)}}

/* ---------- طوارئ / مقارنة / صوت / مشاركة ---------- */
.sosbtn{left:24px;bottom:24px;height:56px;padding:0 20px 0 8px;border-radius:var(--rp);display:flex;align-items:center;gap:10px;background:#7a2019;color:#fff;font:700 15px var(--font);border:1.5px solid rgba(255,255,255,.35);box-shadow:0 10px 24px -8px rgba(142,42,34,.8);transition:transform .15s}
.sosbtn:hover{transform:translateY(-2px)}
.sosbtn .ic{width:40px;height:40px;border-radius:50%;background:#fff;color:#8e2a22;display:grid;place-items:center}
.sosbtn.on{box-shadow:0 0 0 5px rgba(142,42,34,.25),0 10px 24px -8px rgba(142,42,34,.8)}
.sosnums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:2px 0 12px}
.sosnums a{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r2);background:rgba(142,42,34,.1);color:var(--red,#8e2a22);text-decoration:none;font-weight:700;border:1px solid rgba(142,42,34,.25)}
.sosnums a b{font-size:20px;font-variant-numeric:tabular-nums}.sosnums a small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.sosrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.sosrow .ci{width:40px;height:40px;border-radius:12px;background:#8e2a22;color:#fff;display:grid;place-items:center;flex:none}
.sosrow .t{flex:1;min-width:0}.sosrow .t small{color:var(--muted);font-size:var(--fs-xs)}
.sosrow .t b{display:block;font-size:var(--fs-sm);line-height:1.4}
.sosrow .m{font-weight:700;font-size:15px;white-space:nowrap}
.snum{background:#8e2a22;color:#fff;border-radius:12px;width:34px;height:34px;display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.mic{width:48px;height:48px;border-radius:var(--r2);display:grid;place-items:center;flex:none;color:var(--brand);background:var(--brand-soft);transition:all .15s}
body.dark .mic{color:var(--gold)}
.mic.on{background:#8e2a22;color:#fff;animation:ring2 1.2s ease-out infinite}
@keyframes ring2{0%{box-shadow:0 0 0 0 rgba(142,42,34,.6)}100%{box-shadow:0 0 0 14px rgba(142,42,34,0)}}
.cmpm{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--font);color:#fff;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.cmpm.a{background:#2B1E3F}.cmpm.b{background:#8e2a22}
body.picking .leaflet-container{cursor:crosshair}
.cmpsteps{display:flex;gap:8px;margin:2px 0 12px}
.cmpsteps div{flex:1;padding:10px;border-radius:var(--r2);border:1.5px dashed var(--line);text-align:center;font-size:var(--fs-sm);color:var(--muted)}
.cmpsteps div.ok{border-style:solid;border-color:var(--brand);color:var(--ink);background:var(--brand-soft)}
.cmpsteps b{display:block;font-size:18px}
.cmpscores{display:flex;gap:10px;margin:6px 0 10px}
.cs{flex:1;border-radius:var(--r2);padding:12px;text-align:center;background:var(--chip);border:1.5px solid var(--line)}
.cs i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-weight:700;font-size:13px}
.cs.a i{background:#2B1E3F}.cs.b i{background:#8e2a22}
.cs b{display:block;font-size:34px;line-height:1.1;margin-top:4px}.cs small{color:var(--muted)}
.cs.win{border-color:var(--brand);background:var(--brand-soft)}
.cverd{font-weight:700;font-size:var(--fs-sm);margin:4px 0 10px;line-height:1.7}
.crow{display:grid;grid-template-columns:1fr 70px 70px;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:var(--fs-sm)}
.crow .cv{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}.crow .cv.w{color:var(--brand);font-weight:700}
body.dark .crow .cv.w{color:var(--gold)}
.chead{display:grid;grid-template-columns:1fr 70px 70px;gap:6px;font-size:11px;color:var(--muted);text-align:center}
.acts{position:relative}
.expmenu{position:absolute;bottom:52px;inset-inline-start:0;min-width:230px;border-radius:var(--r2);padding:6px;z-index:50;display:flex;flex-direction:column;gap:2px}
.expmenu button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r1);text-align:start;color:var(--ink)}
.expmenu button:hover{background:var(--brand-soft)}
.expmenu .ms{color:var(--brand);font-size:22px}body.dark .expmenu .ms{color:var(--gold)}
.expmenu span{display:flex;flex-direction:column}.expmenu b{font-size:var(--fs-sm)}.expmenu small{font-size:11px;color:var(--muted)}
.shrow{display:flex;gap:8px;margin-top:10px}
.shrow button{flex:1;height:42px;border-radius:var(--r2);display:flex;align-items:center;justify-content:center;gap:6px;font:600 var(--fs-sm) var(--font);background:var(--chip);border:1px solid var(--line);color:var(--ink)}
.shrow button.wa{background:#25d366;border-color:#25d366;color:#07351b}
.acts{flex-wrap:wrap}
@media (max-width:760px){.sosbtn{left:10px;bottom:96px;height:48px}.sosbtn .ic{width:34px;height:34px}}

/* ---------- لوحة تخطيط المشوار ---------- */
.tinput{width:100%;min-height:86px;resize:none;border-radius:var(--r2);border:1px solid var(--line);background:var(--chip);color:var(--ink);font:500 15px/1.7 var(--font);padding:12px 14px;outline:0}
.tinput:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.tgo{width:100%;margin-top:10px;height:48px;border-radius:var(--r2);background:var(--brand);color:#fff;font:700 15px var(--font);display:flex;align-items:center;justify-content:center;gap:8px}
body.dark .tgo{background:#7D5BB5;color:#fff}
.tgo:hover{filter:brightness(1.08)}
.tex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tex button{font:500 12px var(--font);padding:5px 11px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--muted)}
.tex button:hover{color:var(--ink);border-color:var(--brand)}
.ttot{margin:14px 0 6px;padding:12px 14px;border-radius:var(--r2);background:var(--brand);color:#fff;display:flex;justify-content:space-between;align-items:baseline}
body.dark .ttot{background:#7D5BB5;color:#fff}
.ttot b{font-size:26px;font-weight:700}.ttot span{font-size:13px;opacity:.9}
.tsteps{position:relative;margin:8px 0}
.tstep{display:flex;gap:12px;align-items:center;padding:9px 0;position:relative}
.tstep:not(:last-child)::after{content:'';position:absolute;right:15px;top:42px;bottom:-8px;border-right:2px dotted var(--line2,var(--line))}
.tstep .n{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none;border:2px solid var(--solid,#fff);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.tstep .n.s{background:var(--red,#8e2a22)}
.tstep b{display:block;font-size:var(--fs-sm)}.tstep small{color:var(--muted);font-size:var(--fs-xs)}
.tnote{font-size:12px;color:var(--muted);margin:4px 0 10px}
.terr{padding:12px 14px;border-radius:var(--r2);background:rgba(142,42,34,.1);color:var(--red,#8e2a22);font-size:var(--fs-sm);margin-top:12px;line-height:1.8}
.tnum{background:var(--brand);color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font:700 14px var(--font);border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.4)}
body.dark .tnum{background:#7D5BB5;color:#fff;border-color:#2B1E3F}

/* ---------- زر تخطيط المشوار ---------- */
.tripbtn{top:100px;left:50%;transform:translateX(-50%);height:50px;padding:0 20px 0 8px;border-radius:var(--rp);display:flex;align-items:center;gap:12px;color:#fff;font:700 var(--fs-md,15px)/1 var(--font);background:linear-gradient(135deg,#5B3F8F,#6E4FA3);border:1.5px solid var(--gold);box-shadow:0 10px 24px -10px rgba(91,63,143,.7),0 0 0 4px rgba(217,168,72,.25);transition:transform .18s var(--ease),box-shadow .18s}
.tripbtn:hover{transform:translateX(-50%) translateY(-2px);box-shadow:0 14px 28px -10px rgba(91,63,143,.8),0 0 0 6px rgba(217,168,72,.32)}
.tripbtn .ic{width:36px;height:36px;border-radius:50%;background:#7D5BB5;color:#fff;display:grid;place-items:center}
.tripbtn .ic .ms{font-size:21px}
.tripbtn small{display:block;font-weight:500;font-size:11px;opacity:.85;margin-top:3px}
body.dark .tripbtn{background:linear-gradient(135deg,#7D5BB5,#8E6CCB);color:#fff;border-color:#fff3}
body.dark .tripbtn .ic{background:#2B1E3F;color:var(--gold)}
@media (max-width:760px){.tripbtn{top:74px;left:auto;right:10px;transform:none;height:44px}.tripbtn:hover{transform:none}.tripbtn small{display:none}}



/* ---------- حركة التفكير ---------- */
.think{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.think .ts{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:var(--fs-sm);color:var(--muted);opacity:0;transform:translateY(6px);animation:tin .4s var(--ease) forwards}
.think .ts.done{opacity:1;transform:none;animation:none}
.think .ts.act{color:var(--ink);font-weight:600}
.think .d{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--chip)}
.think .done .d{background:var(--brand);color:var(--on-brand)}body.dark .think .done .d{color:#2B1E3F}
.think .d .ms{font-size:15px}
.think .act .d::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--brand);animation:pulse2 1s ease-in-out infinite}
@keyframes tin{to{opacity:1;transform:none}}
@keyframes pulse2{50%{transform:scale(1.7);opacity:.35}}
.spin{animation:spin 1s linear infinite}
/* ---------- أسئلة مقترحة ---------- */
.sugg{position:absolute;top:calc(100% + 8px);left:0;right:0;border-radius:var(--r2);padding:6px;display:flex;flex-direction:column;gap:1px;z-index:30;animation:drop2 .2s var(--ease)}
.sugg.hidden{display:none}
.ui>.searchbar:focus-within{z-index:700}
.sugg .h{font-size:11px;color:var(--muted);padding:4px 10px 2px}
.sugg button{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:var(--r1);font:500 14px var(--font);color:var(--ink);text-align:start}
.sugg button:hover,.sugg button:focus-visible{background:var(--brand-soft);outline:none}
.sugg .ms{font-size:18px;color:var(--brand)}body.dark .sugg .ms{color:var(--gold)}
/* ---------- السؤال السابق/التالي ---------- */
.hnav{display:flex;align-items:center;gap:0}
.hnav button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.hnav button:hover:not(:disabled){background:var(--chip);color:var(--ink)}
.hnav button:disabled{opacity:.3;cursor:default}
.hnav .ms{font-size:20px}
.hnav small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:26px;text-align:center}
/* ---------- تبويبات المشوار / رحلة بر ---------- */
.tabs{display:flex;gap:3px;background:var(--chip);padding:3px;border-radius:999px}
.tab{padding:6px 14px;border-radius:999px;font:600 13px var(--font);color:var(--muted)}
.tab.on{background:var(--brand);color:var(--on-brand)}body.dark .tab.on{color:#2B1E3F}
.rng{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.rng span{font-size:12px;color:var(--muted);margin-inline-end:4px}
.rng button{font:600 12px var(--font);padding:5px 11px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--muted)}
.rng button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}body.dark .rng button.on{color:#2B1E3F}
.rverdict{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:var(--r2);font-weight:700;font-size:var(--fs-sm);line-height:1.5}
.rverdict .ms{font-size:24px}
.rverdict.ok{background:rgba(21,128,61,.12);color:#15803d}
.rverdict.warn{background:rgba(180,83,9,.13);color:#b45309}
.rverdict.danger{background:rgba(185,28,28,.12);color:#b91c1c}
body.dark .rverdict.ok{color:#6fd49a}body.dark .rverdict.warn{color:#f0b35a}body.dark .rverdict.danger{color:#f08a80}
.rroute{margin:12px 0 4px;font-size:var(--fs-sm);color:var(--muted)}.rroute b{color:var(--ink)}
.rstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.rstats div{padding:10px 8px;border-radius:var(--r2);background:var(--chip);text-align:center;min-width:0}
.rstats b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.rstats small{font-size:11px;color:var(--muted)}
.rsec{font-size:12px;font-weight:700;color:var(--brand);margin:14px 0 2px}body.dark .rsec{color:var(--gold)}
.rnum{background:#475569;color:#fff;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font:700 14px var(--font);border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.fdot{width:10px;height:10px;border-radius:50%;background:#475569;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.hdot{width:12px;height:12px;border-radius:50%;background:#dc2626;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.rend{white-space:nowrap;background:var(--solid);color:var(--ink);font:700 12px var(--font);padding:3px 10px;border-radius:9px;border:1px solid var(--line);box-shadow:var(--shadow);transform:translate(-50%,-130%)}

/* ---------- شريط التصنيفات (يسار) ---------- */
.rail{left:24px;top:calc(50% + 24px);transform:translateY(-50%);width:68px;border-radius:var(--r3);padding:var(--s2);display:flex;flex-direction:column;gap:2px;max-height:calc(100% - 350px);overflow-y:auto;scrollbar-width:none;transition:width .25s var(--ease)}
.rail::-webkit-scrollbar{display:none}
.rail.expanded{width:236px}
.cbtn{position:relative;display:flex;align-items:center;gap:12px;height:44px;min-height:44px;padding:0 11px;border-radius:var(--r2);color:var(--muted);transition:background .15s,color .15s,transform .15s;white-space:nowrap;overflow:hidden}
.cbtn:hover{background:var(--brand-soft);color:var(--ink)}
.cbtn .lb{display:none;font-size:var(--fs-sm);font-weight:500}
.rail.expanded .cbtn .lb{display:block}
.cbtn.on{background:var(--brand);color:var(--on-brand)}
body.dark .cbtn.on{background:#7D5BB5;color:#fff}
.cbtn.on .ms{font-variation-settings:'FILL' 1}
.cbtn.pop{animation:pop .28s var(--ease)}
.cbtn .xm{display:none}
.cbtn.on .xm{display:grid;place-items:center;position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;transition:background .15s}
.cbtn.on .xm .ms{font-size:12px;font-weight:700}
.cbtn.on:hover .xm{background:#8e2a22}
body.dark .cbtn.on .xm{background:rgba(30,22,52,.55)}
.rail.expanded .cbtn.on .xm{position:static;margin-inline-start:auto;width:22px;height:22px;flex:none}
@keyframes pop{0%{transform:scale(.88)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.cbtn[data-tip]:hover::after{content:attr(data-tip);position:fixed;margin-inline-start:0;left:104px;padding:5px 10px;border-radius:var(--r1);background:var(--ink);color:var(--solid);font-size:var(--fs-xs);font-weight:600;pointer-events:none;z-index:900;transform:translateY(-4px)}
.rail.expanded .cbtn[data-tip]:hover::after{display:none}
.rail .sep{height:1px;background:var(--line);margin:var(--s2) var(--s2)}
.rail .gt{display:none;font-size:12px;font-weight:700;color:var(--brand);padding:6px 11px 2px;letter-spacing:.2px}
body.dark .rail .gt{color:var(--gold)}
.railhd{font-weight:700;color:var(--ink)}.railhd .ms{color:var(--brand)}body.dark .railhd .ms{color:var(--gold)}.railhd .chev{margin-inline-start:auto;color:var(--muted)}.railhd .chev .ms{color:var(--muted);font-size:20px}
.rail.expanded .gt{display:block}
.badge{position:absolute;top:-6px;left:6px;min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.railtop{position:relative}
.railtop .badge{top:-8px}

/* ---------- لوحة الإجابة (يمين) ---------- */
.answer{top:100px;right:24px;width:min(384px,calc(100% - 48px));max-height:calc(100% - 250px);overflow:auto;border-radius:var(--r3);padding:var(--s4) var(--s4) var(--s4);scrollbar-width:thin;animation:panelin .35s var(--ease)}
@keyframes panelin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.answer.hide{display:none}
.ah{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
.ah h3{font-size:var(--fs-lg);font-weight:700}
.ah span{font-size:var(--fs-xs);color:var(--muted)}
.ah .x{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
.ah .x:hover{background:var(--chip)}
.steps{position:relative;margin:0 0 var(--s3);padding:0}
.step{position:relative;padding:0 26px var(--s3) 0;font-size:var(--fs-sm);line-height:1.6}
.step::before{content:'';position:absolute;right:5px;top:6px;width:11px;height:11px;border-radius:50%;border:2px solid var(--brand);background:var(--solid)}
.step.first::before{background:var(--brand)}
.step::after{content:'';position:absolute;right:10px;top:20px;bottom:-2px;border-right:2px dashed var(--line2)}
.step:last-child::after{display:none}
.step small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.tech{display:none;margin-top:4px;font:500 10.5px/1.5 ui-monospace,Consolas,monospace;direction:ltr;text-align:left;background:var(--brand-soft);color:var(--brand);padding:3px 8px;border-radius:8px;word-break:break-all}
body.tech .tech{display:block}
.sum{font-size:var(--fs-sm);line-height:1.8;color:var(--ink);background:var(--chip);border-radius:var(--r2);padding:var(--s3);margin-bottom:var(--s3)}
.dest{background:var(--brand);color:#fff;border-radius:var(--r2);padding:var(--s4)}
body.dark .dest{background:#3A2C5A;color:var(--ink);border:1px solid var(--line2)}
.dest .k{font-size:var(--fs-xs);opacity:.8}
.dest .n{font-size:var(--fs-xl);font-weight:700;line-height:1.35;margin:2px 0 var(--s2)}
.nums{display:flex;gap:var(--s5);align-items:baseline;margin-bottom:var(--s3)}
.nums b{font-size:var(--fs-num);font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.nums span{font-size:var(--fs-sm);opacity:.8;margin-inline-start:4px}
.nums i{display:block;font-style:normal;font-size:var(--fs-xs);opacity:.75;margin-top:2px}
.acts{display:flex;gap:var(--s2)}
.pill{height:42px;padding:0 16px;border-radius:var(--r2);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:var(--fs-sm);transition:transform .15s,filter .15s}
.pill:active{transform:scale(.96)}
.pill.solid{background:#2B1E3F;color:#F5EEE2}
body.dark .pill.solid{background:#7D5BB5;color:#fff}
.pill.ghost{background:rgba(255,255,255,.16);color:inherit}
body.light .pill.ghost{background:rgba(255,255,255,.2)}
.pill .ms{font-size:18px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--chip),var(--line),var(--chip));background-size:200% 100%;animation:sk 1.2s linear infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- الشريط السفلي ---------- */
.strip{bottom:24px;left:50%;transform:translateX(-50%);width:min(980px,calc(100% - 520px));border-radius:var(--r3);display:flex;align-items:stretch;overflow:hidden;animation:up .35s var(--ease)}
@keyframes up{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.sitem{flex:1 1 0;min-width:170px;display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s4);border-inline-end:1px solid var(--line);min-width:0}
.sitem:last-child{border-inline-end:0}
.sitem .t{flex:1;min-width:0}
.sitem .t b{display:-webkit-box;word-break:normal;overflow-wrap:anywhere;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:var(--fs-sm);font-weight:600;line-height:1.4}
.sitem .t small{color:var(--muted);font-size:var(--fs-xs)}
.sitem .m{font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.sitem .m small{font-size:var(--fs-xs);color:var(--muted);font-weight:400;margin-inline-start:2px}
.plus{width:38px;height:38px;border-radius:12px;background:var(--chip);color:var(--ink);display:grid;place-items:center;flex:none;border:1px solid var(--line);transition:all .15s}
.plus:hover,.sitem.first .plus{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.sitem .plus .ms{font-size:20px}
.scale{width:130px;padding:var(--s3) var(--s4);flex:none;border-inline-end:1px solid var(--line)}
.scale small{font-size:var(--fs-xs);color:var(--muted)}
.bars{display:flex;gap:4px;margin:6px 0 3px}
.bars i{flex:1;height:6px;border-radius:3px;background:var(--line2)}
.bars i.on{background:var(--brand)}
.lbls{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}

/* ---------- نوع الخريطة والتكبير ---------- */
.mtbtn{display:none}
.maptype{bottom:88px;right:24px;border-radius:var(--r2);padding:4px;display:flex;gap:2px;z-index:520}
.maptype button{height:34px;padding:0 12px;border-radius:10px;font-size:var(--fs-xs);font-weight:600;color:var(--muted);white-space:nowrap}
.maptype button .ms{display:none}
.maptype button.on{background:var(--brand);color:#fff}
body.dark .maptype button.on{background:var(--gold);color:#1e1a16}
.zoom{bottom:24px;right:24px;border-radius:var(--r2);display:flex;overflow:hidden}
.zoom button{width:46px;height:46px;display:grid;place-items:center;color:var(--ink)}
.zoom button:hover{background:var(--brand-soft)}
.zoom button+button{border-inline-start:1px solid var(--line)}
.devchip{bottom:92px;left:24px;border-radius:var(--r2);padding:8px 14px;display:flex;align-items:center;gap:10px;font-size:var(--fs-sm);font-weight:600}
.devchip small{display:block;color:var(--muted);font:400 10.5px ui-monospace,Consolas,monospace}
.devchip .ico{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.attr{bottom:5px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);z-index:400;text-shadow:0 0 4px var(--solid)}
.lstkey{bottom:140px;right:24px;border-radius:var(--r1);padding:6px 10px;font-size:10.5px;display:none;flex-direction:column;gap:4px;min-width:170px}
.lstkey i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,#2b50aa,#4cc9f0,#90ee7e,#ffd23f,#f46d43,#a50026)}
.lstkey div{display:flex;justify-content:space-between;color:var(--muted)}

/* ---------- الترحيب والدليل ---------- */
.greet{overflow:hidden;top:164px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 40px));border-radius:var(--r3);padding:var(--s4) var(--s5);animation:drop .5s var(--ease)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
.greet .gt{font-size:var(--fs-lg);font-weight:700;color:var(--brand)}
body.dark .greet .gt{color:var(--gold)}
.greet .gx{font-size:var(--fs-sm);color:var(--muted);line-height:1.8;margin-top:2px}
.greet .gi{display:none}
.greet .x{position:absolute;top:8px;left:8px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.guide{top:72px;left:24px;width:min(420px,calc(100% - 40px));border-radius:var(--r3);padding:var(--s4);animation:drop .3s var(--ease);transform:none}
@keyframes drop2{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.guide{animation:drop2 .3s var(--ease)}
.mi:hover{background:var(--brand-soft)}
.guide h4{font-size:var(--fs-lg);margin-bottom:var(--s3)}
.mi .sw{margin-inline-start:auto;align-self:center;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--muted);border:1px solid var(--line)}.mi.on .sw{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.gs{display:flex;gap:12px;padding:8px 4px;align-items:flex-start}
.gs .gi{width:38px;height:38px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.gs b{display:block;font-size:var(--fs-sm)}.gs span{font-size:var(--fs-xs);color:var(--muted);line-height:1.7}
.hidden{display:none!important}

/* ---------- العلامات على الخريطة ---------- */
.pinw{position:relative}
.pin{width:32px;height:32px;border-radius:11px;background:var(--solid);color:var(--c);border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.28);transition:transform .15s var(--ease)}
.pin .ms{font-size:19px;font-variation-settings:'FILL' 1}
.pinw:hover .pin{transform:scale(1.14)}
.pin.sel{background:var(--c);color:#fff;border-color:#fff;transform:scale(1.25)}
.pin.sel::after{content:'';position:absolute;inset:-7px;border-radius:15px;border:2px solid var(--c);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.pin.big{width:44px;height:44px;border-radius:15px;background:var(--accent);color:#fff;border:2px solid #fff}
.pin.big .ms{font-size:26px}
.lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;white-space:nowrap;font:600 11px var(--font);background:var(--solid);color:var(--ink);padding:2px 8px;border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.22);display:none;pointer-events:none}
body.names .map-z .lbl,.pin.sel+.lbl,.pinw.always .lbl{display:block}
.me{position:relative;width:36px;height:36px}
.me i{position:absolute;inset:0;border-radius:50%;background:#5B3F8F;border:3px solid #fff;box-shadow:0 2px 10px rgba(43,30,63,.55);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.me i svg{width:24px;height:24px;display:block}
.me::before{content:'';position:absolute;inset:0;border-radius:50%;background:#D9A848;animation:pulse 1.8s ease-out infinite}
.me b{position:absolute;top:44px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px var(--font);background:#2B1E3F;color:#F5EEE2;padding:3px 10px;border-radius:9px;box-shadow:var(--shadow)}
.cl{width:40px;height:40px;border-radius:50%;background:var(--brand);color:#fff;border:3px solid var(--solid);display:grid;place-items:center;font:700 13px var(--font);box-shadow:0 2px 10px rgba(0,0,0,.35)}
.rlabel{background:var(--solid);color:var(--ink);font:600 11px var(--font);padding:2px 8px;border-radius:7px;border:1px solid var(--line2);white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.ringlbl{font:700 11px var(--font);color:var(--brand);white-space:nowrap;text-shadow:0 0 4px var(--solid),0 0 4px var(--solid)}
body.dark .cl{background:#7D5BB5;color:#fff}
.leaflet-tooltip{background:var(--solid);color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;font:600 12px var(--font);padding:4px 9px}
.leaflet-tooltip:before{display:none}

/* ---------- الشاشات الصغيرة ---------- */

}

}
@media (max-width:760px){
  /* ترتيب الجوال: بحث نحيف بالأعلى، أدوات صغيرة على الجانب، والأماكن + تخطيط مشوار بالأسفل */
  .brand{top:10px;right:10px;width:44px;height:44px;padding:0;border-radius:50%;justify-content:center;gap:0}

  .topleft{top:64px;left:10px;right:auto;flex-direction:column;align-items:center;gap:10px}

  .helpbtn span.t{display:none}

  .rail{left:10px;right:10px;top:auto;bottom:66px;transform:none;width:auto!important;flex-direction:row;max-height:none;overflow-x:auto;overflow-y:hidden;padding:7px;gap:6px;border-radius:20px}
  .rail .sep,.rail .gt,.rail .lb{display:none!important}

  .cbtn[data-tip]:hover::after{display:none}
  .railtop{display:none}
  .tripbtn{top:auto;bottom:10px;left:10px;right:10px;transform:none;height:48px;justify-content:center;padding:0 14px 0 8px;font-size:16px}
  .tripbtn:hover{transform:none}.tripbtn small{display:none}
  .sosbtn{left:10px;bottom:140px;height:40px;padding:0 14px 0 6px;font-size:14px}
  .sosbtn .ic{width:28px;height:28px}
  .mtbtn{display:grid;place-items:center;border-radius:50%;color:var(--brand);transition:background .15s,color .15s,transform .15s}
  .mtbtn .ms{font-size:26px}.mtbtn:active{transform:scale(.94)}
  .mtbtn.open{background:var(--brand);color:#fff}body.dark .mtbtn{color:#B9A3DC}body.dark .mtbtn.open{background:#7D5BB5;color:#fff}
  .maptype{display:none;flex-direction:column;padding:6px;min-width:176px;gap:2px}

  .maptype button.on{background:var(--brand-soft);color:var(--brand);font-weight:700}.maptype button.on .ms{color:var(--brand)}
  body.dark .maptype button.on{background:#3a2c5a;color:#B9A3DC}body.dark .maptype button.on .ms{color:#B9A3DC}
  .mtbtn{bottom:140px;right:10px;width:44px;height:44px}
  .maptype{bottom:192px;top:auto;right:10px}
  .answer{top:auto;right:10px;left:10px;bottom:132px;width:auto;max-height:calc(100dvh - 210px);border-radius:var(--r3);animation:sheet .35s var(--ease)}
  @keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .strip{left:10px;right:10px;bottom:132px;width:auto;transform:none;animation:none}
  .scale{display:none}.sitem{padding:var(--s2) var(--s3)}.sitem .m{font-size:20px}
  .sitem:nth-child(n+3){display:none}

<script>
/* ===================== بروتوكول Streamlit ===================== */
function send(type, data){ window.parent.postMessage(Object.assign({isStreamlitMessage:true, type:type}, data||{}), '*'); }
function setValue(v){ send('streamlit:setComponentValue', {value:v, dataType:'json'}); }
function setHeight(h){ send('streamlit:setFrameHeight', {height:h}); }
var nonce = Date.now();
function emit(o){ o.nonce = (++nonce); setValue(o); }

/* ===================== الحالة ===================== */
var THINK_ASK=['أفهم سؤالك','أبحث في الطبقات حول موقعك','أحسب المسافات والمسار','أجهّز الجواب'];
var THINK_ROAD=['أحدد المدينتين على الخريطة','أرسم مسار الطريق','أفحص محطات الوقود على امتداد الطريق','أرتّب توقفات التعبئة'];
var SUGG=[['local_hospital','وين أقرب 3 مستشفيات لي؟'],['mosque','كم مسجد ضمن 1 كم من موقعي؟'],['local_gas_station','أقرب محطة وقود وارسم لي المسار']];
var RVERDICT={ok:['verified','الطريق مغطّى بمحطات الوقود'],warn:['warning','فيه مقطع طويل بدون وقود، خطّط توقفك'],danger:['report','فيه مقطع أطول من مدى سيارتك']};
var S = {data:null, dark:false, active:new Set(), map:null, group:null, base:{}, mtype:'streets',
         sel:null, selLayer:null, user:null, ringLayer:null, routeLayer:null, expanded:(load('railx')!=='0'),
         names:true, rings:false, panel:'none', answerId:null, busy:false, guideOpen:false, ready:false, lastFit:0, dismissed:null, cmp:{mode:false,a:null,b:null,busy:false,showRes:false}, sosShown:false};
function CA(){ var a=S.data&&S.data.answer; return (a && String(a.id)!==String(S.dismissed))?a:null; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var KAABA='<svg class="kaaba" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 8 12 4.5 20.5 8v11.5a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z" fill="#2B1E3F" stroke="#F5EEE2" stroke-width="1.1" stroke-linejoin="round"/><path d="M3.5 10.6h17v2.3h-17z" fill="#e0b13c"/><path d="M14.2 20.5v-4.6a1.2 1.2 0 0 1 1.2-1.2h.2a1.2 1.2 0 0 1 1.2 1.2v4.6z" fill="#e0b13c"/></svg>';
function ms(n, cls){ if(n==='kaaba') return '<span class="ms-svg'+(cls?' '+cls:'')+'">'+KAABA+'</span>'; return '<span class="ms'+(cls?' '+cls:'')+'">'+n+'</span>'; }
function fmt1(x){ return Number(x).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1}); }
function store(k,v){ try{ sessionStorage.setItem('masar_'+k, v); }catch(e){} }
function load(k){ try{ return sessionStorage.getItem('masar_'+k); }catch(e){ return null; } }
function estMin(km){ var road=km*1.3, sp = road<=6?30:(road<=40?50:90); return Math.max(1, Math.round(road/sp*60)); }
function fmtMin(m){ if(m<60) return {v:m,u:'د'}; var h=Math.floor(m/60), r=m%60; return {v:h+(r?':'+('0'+r).slice(-2):''),u:'س'}; }
function hav(a,b,c,d){ var R=6371,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,q=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)*Math.sin(y/2); return 2*R*Math.asin(Math.sqrt(q)); }

/* ===================== تحميل Leaflet ===================== */
function loadScript(urls, cb){
  var i=0; (function next(){ if(i>=urls.length){ cb(false); return; }
    var s=document.createElement('script'); s.src=urls[i++]; s.onload=function(){cb(true);}; s.onerror=next; document.head.appendChild(s); })();
}
var LEAF = ['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js','https://unpkg.com/leaflet@1.9.4/dist/leaflet.js','https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js'];
var CLUS = ['https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js','https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js'];
var pendingRender = null;
// أرسل الجاهزية فورًا حتى لا يبقى المكوّن معلّقًا، وأظهر أي خطأ على الشاشة
send('streamlit:componentReady', {apiVersion:1});
setHeight(Math.max(window.innerHeight, 680));
window.addEventListener('error', function(ev){
  try{ var d=document.getElementById('errbox'); if(!d){ d=document.createElement('div'); d.id='errbox';
    d.style.cssText='position:fixed;bottom:8px;left:8px;right:8px;z-index:99999;background:#8e2a22;color:#fff;font:12px monospace;padding:8px 12px;border-radius:10px;direction:ltr;max-height:30vh;overflow:auto';
    document.body.appendChild(d);} d.textContent += (ev.message||'error')+' @'+(ev.lineno||'')+'\n'; }catch(e){}
});
if (window.L) { boot(); } else loadScript(LEAF, function(ok){ if(!ok){ $('ui').insertAdjacentHTML('beforeend','<div class="greet glass" style="top:100px">تعذّر تحميل مكتبة الخريطة. تحقق من الاتصال بالإنترنت.</div>'); }
  else loadScript(CLUS, function(){ boot(); }); });

function boot(){
  try{ initMap(); bindUI(); }catch(e){ window.dispatchEvent(new ErrorEvent('error',{message:'boot: '+e.message})); }
  S.ready=true;
  window.addEventListener('message', function(e){ if(e.data && e.data.type==='streamlit:render') onRender(e.data.args); });
  window.addEventListener('resize', function(){ if(S.map) S.map.invalidateSize(); });
  if (pendingRender) onRender(pendingRender);
}
// الرسائل قد تصل قبل اكتمال التحميل
window.addEventListener('message', function(e){ if(!S.ready && e.data && e.data.type==='streamlit:render') pendingRender = e.data.args; });
if (!window.L) { /* سيرسل componentReady بعد boot */ } 

/* ===================== الخريطة ===================== */
function initMap(){
  S.map = L.map('map', {zoomControl:false, attributionControl:false, zoomSnap:.5, minZoom:4, maxZoom:19, worldCopyJump:false});
  S.map.setView([24.5,45.0], 6);
  S.base.streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, className:'osm'});
  S.base.sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19});
  S.base.light = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {maxZoom:19, subdomains:'abcd', className:'osm'});
  S.base.topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {maxZoom:17, subdomains:'abc', className:'osm'});
  S.base.streets.addTo(S.map);
  S.group = L.layerGroup().addTo(S.map);
  S.routeLayer = L.layerGroup().addTo(S.map);
  S.tripLayer = L.layerGroup().addTo(S.map); S.roadLayer = L.layerGroup().addTo(S.map);
  S.sosLayer = L.layerGroup().addTo(S.map);
  S.cmpLayer = L.layerGroup().addTo(S.map);
  S.map.on('click', function(e){
    if(!S.cmp.mode || S.cmp.busy || S.panel!=='cmp') return;
    if(!S.cmp.a) S.cmp.a=[+e.latlng.lat.toFixed(5), +e.latlng.lng.toFixed(5)];
    else if(!S.cmp.b) S.cmp.b=[+e.latlng.lat.toFixed(5), +e.latlng.lng.toFixed(5)]; else return;
    S.cmp.showRes=false; drawCmp(); renderPanel();
  });
  S.ringLayer = L.layerGroup().addTo(S.map);
  S.selLayer = L.layerGroup().addTo(S.map);
  S.userLayer = L.layerGroup().addTo(S.map);
  S.map.on('zoomend', zoomCls); zoomCls();
}
function zoomCls(){ var c=S.map.getContainer(); c.classList.toggle('map-z', S.map.getZoom()>=14); }
function setMapType(t){
  S.mtype=t; var m=S.map;
  ['streets','light','topo','sat'].forEach(function(k){ var l=S.base[k]; if(l && m.hasLayer(l)) m.removeLayer(l); });
  if(S.lst && m.hasLayer(S.lst)) m.removeLayer(S.lst);
  var bk=S.base[t]?t:'streets'; S.base[bk].addTo(m);
  if(bk==='topo' && m.getZoom()>17) m.setZoom(17);
  if(t==='lst'){ var d=(S.data&&S.data.lstDate)||''; S.lst=L.tileLayer('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/MODIS_Terra_Land_Surface_Temp_Day/default/'+d+'/GoogleMapsCompatible_Level7/{z}/{y}/{x}.png',{maxNativeZoom:7,maxZoom:19,opacity:.62}); S.lst.addTo(m); }
  var at=document.querySelector('.attr'); if(at) at.textContent = t==='sat' ? 'Imagery © Esri' : t==='light' ? '© OpenStreetMap contributors © CARTO' : t==='topo' ? '© OpenStreetMap contributors, SRTM | © OpenTopoMap (CC-BY-SA)' : '© OpenStreetMap contributors';
  document.querySelectorAll('#maptype button').forEach(function(b){ b.classList.toggle('on', b.dataset.t===t); });
  $('lstkey').style.display = (t==='lst')?'flex':'none';
}
function pinIcon(m, p, sel){
  var cls='pin'+(m.big?' big':'')+(sel?' sel':'');
  var html='<div class="pinw"><div class="'+cls+'" style="--c:'+m.color+'">'+ms(m.icon)+'</div><div class="lbl">'+esc(p[2])+'</div></div>';
  var sz=m.big?44:32; return L.divIcon({className:'', html:html, iconSize:[sz,sz], iconAnchor:[sz/2,sz/2]});
}
function clusterIcon(c){ return L.divIcon({className:'', html:'<div class="cl">'+c.getChildCount()+'</div>', iconSize:[40,40]}); }

function drawUser(){
  S.userLayer.clearLayers(); var d=S.data; if(!d||!d.loc) return;
  L.marker(d.loc,{icon:L.divIcon({className:'',html:'<div class="me"><i><svg viewBox="22 22 156 156" width="26" height="26"><rect x="50" y="50" width="100" height="100" fill="none" stroke="#B9A3DC" stroke-width="6"/><rect x="50" y="50" width="100" height="100" fill="none" stroke="#B9A3DC" stroke-width="6" transform="rotate(45 100 100)"/><path d="M100 100L100 30" stroke="#D9A848" stroke-width="13" stroke-linecap="round"/><path d="M100 100L100 170M100 100L30 100M100 100L170 100" stroke="#F5EEE2" stroke-width="13" stroke-linecap="round"/><circle cx="100" cy="100" r="15" fill="#5B3F8F" stroke="#F5EEE2" stroke-width="7"/></svg></i><b>أنت هنا</b></div>',iconSize:[36,36],iconAnchor:[18,18]}),zIndexOffset:1000,interactive:false}).addTo(S.userLayer);
  if(d.acc && d.acc>60) L.circle(d.loc,{radius:Math.min(d.acc,3000),color:'#5B3F8F',weight:1,fillOpacity:.08,interactive:false}).addTo(S.userLayer);
}
function drawRings(){
  S.ringLayer.clearLayers(); var d=S.data; if(!d||!d.loc) return;
  if(!(S.rings || (CA() && CA().rings))) return;
  [[15,7500],[10,5000],[5,2500]].forEach(function(r){
    L.circle(d.loc,{radius:r[1],color:getComputedStyle(document.body).getPropertyValue('--ringline'),weight:1.2,fillColor:getComputedStyle(document.body).getPropertyValue('--ring'),fillOpacity:1,interactive:false}).addTo(S.ringLayer);
    var ll=L.latLng(d.loc[0], d.loc[1]); var north=L.latLng(ll.lat + (r[1]/111320)*.72, ll.lng + (r[1]/(111320*Math.cos(ll.lat*Math.PI/180)))*.69);
    L.marker(north,{icon:L.divIcon({className:'',html:'<div class="ringlbl">'+r[0]+' د</div>',iconSize:[0,0]}),interactive:false}).addTo(S.ringLayer);
  });
}
function drawMarkers(){
  S.group.clearLayers();
  var total=0;
  S.data.cats.forEach(function(c){
    if(!S.active.has(c.key)) return;
    var cg = (L.markerClusterGroup) ? L.markerClusterGroup({maxClusterRadius:42, disableClusteringAtZoom:15, showCoverageOnHover:false, spiderfyOnMaxZoom:false, iconCreateFunction:clusterIcon}) : L.layerGroup();
    c.members.forEach(function(m){
      (m.lines||[]).forEach(function(ln){ L.polyline(ln,{color:m.color,weight:3,dashArray:'8 6',opacity:.85,interactive:false}).addTo(S.group); });
      m.pts.forEach(function(p){
        total++;
        var mk=L.marker([p[0],p[1]],{icon:pinIcon(m,p,false), zIndexOffset:m.big?900:0, title:p[2]});
        mk.on('click', function(){ selectPlace({key:m.key,cat:c.key,name:p[2],lat:p[0],lon:p[1],km:p[3],icon:m.icon,color:m.color,label:m.label}); });
        cg.addLayer(mk);
      });
    });
    cg.addTo(S.group);
  });
  $('railbadge').textContent = total; $('railbadge').style.display = total?'grid':'none';
  renderStrip();
}
function userBounds(extra){
  var pts=(S.data.loc?[S.data.loc]:[]).concat(extra||[]); return pts;
}
function fitTo(pts, answerOpen){
  if(!pts.length) return; var small = window.innerWidth<=760;
  var opts = small ? {padding:[40,40],maxZoom:15} : {paddingTopLeft:[130,110],paddingBottomRight:[answerOpen?430:100,170],maxZoom:15};
  S.map.fitBounds(L.latLngBounds(pts), opts);
}

/* ===================== التحديد ===================== */
function selectPlace(p, keepPanel){
  S.sel=p; S.selLayer.clearLayers();
  var icon = L.divIcon({className:'',html:'<div class="pinw always"><div class="pin sel" style="--c:'+p.color+'">'+ms(p.icon)+'</div><div class="lbl">'+esc(p.name)+'</div></div>',iconSize:[32,32],iconAnchor:[16,16]});
  L.marker([p.lat,p.lon],{icon:icon,zIndexOffset:1500,interactive:false}).addTo(S.selLayer);
  if(S.data.loc){
    L.polyline([S.data.loc,[p.lat,p.lon]],{color:getComputedStyle(document.body).getPropertyValue('--accent'),weight:3,dashArray:'8 8',opacity:.95,interactive:false}).addTo(S.selLayer);
    var mid=[(S.data.loc[0]+p.lat)/2,(S.data.loc[1]+p.lon)/2];
    L.marker(mid,{icon:L.divIcon({className:'',html:'<div class="rlabel">'+fmt1(p.km)+' كم</div>',iconSize:[0,0]}),interactive:false}).addTo(S.selLayer);
    fitTo([S.data.loc,[p.lat,p.lon]], true);
  } else S.map.flyTo([p.lat,p.lon],15);
  if(!keepPanel){ S.panel='place'; renderPanel(); }
}
function clearSel(){ S.sel=null; S.selLayer.clearLayers(); S.panel = (CA()?'answer':'none'); renderPanel(); }

/* ===================== اللوحات ===================== */
function renderRail(){
  var h='<div class="railtop"><button class="cbtn railhd" id="expbtn" data-tip="الأماكن" aria-label="الأماكن: طيّ أو توسيع القائمة"><span class="ms">place</span><span class="lb">الأماكن</span><span class="chev lb">'+ms('chevron_left')+'</span></button><span class="badge" id="railbadge" style="display:none">0</span></div>';
  var lastG=null;
  S.data.cats.forEach(function(c){
    if(c.group!==lastG){ h+='<div class="sep"></div><div class="gt">'+esc(c.group)+'</div>'; lastG=c.group; }
    h+='<button class="cbtn'+(S.active.has(c.key)?' on':'')+'" data-k="'+c.key+'" data-tip="'+esc(c.label)+'" aria-pressed="'+S.active.has(c.key)+'">'+ms(c.icon)+'<span class="lb">'+esc(c.label)+'</span><span class="xm" title="إلغاء التحديد">'+ms('close')+'</span></button>';
  });
  h+='<div class="sep"></div>';
  h+='<button class="cbtn" id="clearbtn" data-tip="إخفاء الكل">'+ms('layers_clear')+'<span class="lb">إخفاء الكل</span></button>';
  var r=$('rail'); r.innerHTML=h; r.classList.toggle('expanded',S.expanded);

function geoFeatures(a){

  (a.results||[]).forEach(function(r,i){ f.push({type:'Feature',properties:{kind:'نتيجة',rank:i+1,name:r.name,category:r.label||'',km:r.km,minutes:(r.min!=null?r.min:null)},geometry:{type:'Point',coordinates:[r.lon,r.lat]}}); });
  (a.routes||[]).forEach(function(rt,i){ if(rt.pts&&rt.pts.length>1) f.push({type:'Feature',properties:{kind:'مسار',rank:i+1,straight:!!rt.straight},geometry:{type:'LineString',coordinates:rt.pts.map(function(q){return [q[1],q[0]];})}}); });
  if(loc) f.push({type:'Feature',properties:{kind:'موقعك',name:'موقعك'},geometry:{type:'Point',coordinates:[loc[1],loc[0]]}});
  if(a.geojson&&a.geojson.features) a.geojson.features.forEach(function(x){ f.push(x); });
  return f;

function xmlEsc(t){ return String(t==null?'':t).replace(/[<>&"']/g,function(c){return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c];}); }
function toKml(feats){
  var pm=feats.map(function(f){ var p=f.properties||{}, g=f.geometry, nm=p.name||p['name:ar']||p.kind||'', d=[];
    Object.keys(p).forEach(function(k){ if(p[k]!=null&&p[k]!=='') d.push(k+': '+p[k]); });
    var geo='';
    function ring(c){ return c.map(function(q){return q[0]+','+q[1]+',0';}).join(' '); }
    if(g.type==='Point') geo='<Point><coordinates>'+g.coordinates[0]+','+g.coordinates[1]+',0</coordinates></Point>';
    else if(g.type==='LineString') geo='<LineString><tessellate>1</tessellate><coordinates>'+ring(g.coordinates)+'</coordinates></LineString>';
    else if(g.type==='Polygon') geo='<Polygon><outerBoundaryIs><LinearRing><coordinates>'+ring(g.coordinates[0])+'</coordinates></LinearRing></outerBoundaryIs></Polygon>';
    else if(g.type==='MultiPolygon') geo='<MultiGeometry>'+g.coordinates.map(function(pl){return '<Polygon><outerBoundaryIs><LinearRing><coordinates>'+ring(pl[0])+'</coordinates></LinearRing></outerBoundaryIs></Polygon>';}).join('')+'</MultiGeometry>';
    else if(g.type==='MultiLineString') geo='<MultiGeometry>'+g.coordinates.map(function(l){return '<LineString><coordinates>'+ring(l)+'</coordinates></LineString>';}).join('')+'</MultiGeometry>';
    else return '';
    return '<Placemark><name>'+xmlEsc(nm)+'</name><description>'+xmlEsc(d.join('\n'))+'</description>'+geo+'</Placemark>'; }).join('');
  return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>مسار</name>'+pm+'</Document></kml>';
}

    h+='<button class="gs mi'+(on?' on':'')+'" data-v="'+i[3]+'" style="width:100%;text-align:right;border-radius:14px"><div class="gi">'+ms(i[0])+'</div><div><b>'+i[1]+'</b><span>'+i[2]+'</span></div>'+(i[3]==='rings'?'<span class="sw">'+(on?'مفعّلة':'إيقاف')+'</span>':'')+'</button>'; });
  $('menu').innerHTML=h; $('menu').querySelectorAll('.mi').forEach(function(b){ b.onclick=function(){
    if(b.dataset.v==='rings'){ S.rings=!S.rings; store('rings',S.rings?1:0); drawRings(); renderMenu(); return; }
    if(b.dataset.v==='cmp'){ openCmp(); return; }
    emit({type:'nav',view:b.dataset.v}); }; });
}
function bindUI(){
  renderMenu();
  $('sosbtn').onclick=function(){ if(S.panel==='sos'){ closeSos(); return; } closePops(); leaveSpecial('sos'); S.sosShown=true; $('sosbtn').classList.add('on'); S.panel='sos'; drawSos(); renderPanel(); };
  bindVoice(); bindSugg();
  $('tripbtn').onclick=function(){ closePops(); leaveSpecial('trip'); if(S.panel==='trip'){ S.panel=CA()?'answer':'none'; } else { S.panel='trip'; } renderPanel(); };
  $('menubtn').onclick=function(ev){ ev.stopPropagation(); var o=$('menu').classList.contains('hidden'); closePops(); $('menu').classList.toggle('hidden',!o); };
  $('askform').addEventListener('submit', function(ev){ ev.preventDefault(); var t=$('q').value.trim(); if(!t||S.busy) return;
    S.busy=true; thinkStart('ask'); $('sugg').classList.add('hidden'); $('go').classList.add('busy'); $('go').querySelector('.ms').textContent='progress_activity'; S.panel='answer'; renderPanel(); emit({type:'ask', text:t}); });
  $('themesw').onclick=function(){ S.dark=!S.dark; applyTheme(); emit({type:'theme', dark:S.dark}); };
  if(load('helped')) $('helpbtn').classList.remove('pulse');
  $('helpbtn').onclick=function(ev){ ev.stopPropagation(); var o=$('guide').classList.contains('hidden'); closePops(); $('guide').classList.toggle('hidden',!o); S.guideOpen=o; $('helpbtn').classList.remove('pulse'); store('helped','1'); };
  document.addEventListener('click', function(ev){ if(!$('guide').contains(ev.target) && !$('menu').contains(ev.target)) closePops(); });
  $('greetx').onclick=function(){ $('greet').classList.add('hidden'); };
  function closeMT(){ $('maptype').classList.remove('open'); $('mtbtn').classList.remove('open'); $('mtbtn').setAttribute('aria-expanded','false'); }
  $('mtbtn').onclick=function(e){ e.stopPropagation(); var o=$('maptype').classList.toggle('open'); $('mtbtn').classList.toggle('open',o); $('mtbtn').setAttribute('aria-expanded',o?'true':'false'); };
  document.querySelectorAll('#maptype button').forEach(function(b){ b.onclick=function(){ setMapType(b.dataset.t); closeMT(); }; });
  document.addEventListener('click',function(e){ if(!e.target.closest('#maptype')) closeMT(); });
  $('zin').onclick=function(){ S.map.zoomIn(); }; $('zout').onclick=function(){ S.map.zoomOut(); };
  $('devchip').onclick=function(){ document.body.classList.toggle('tech'); };
}
function closePops(){ S.guideOpen=false; $('guide').classList.add('hidden'); $('menu').classList.add('hidden'); }
function applyTheme(){ document.body.classList.toggle('dark',S.dark); document.body.classList.toggle('light',!S.dark); store('dark',S.dark?1:0); setTimeout(function(){ drawRings(); },0); }

/* ===================== استقبال البيانات ===================== */
function onRender(args){
  if(!args || !args.data) return; var first=!S.data; S.data=args.data;
  if(S.dark!==S.data.dark || first){ S.dark=S.data.dark; applyTheme(); }
  if(first){
    var saved=load('cats'); if(saved){ saved.split(',').forEach(function(k){ if(S.data.cats.some(function(c){return c.key===k;})) S.active.add(k); }); }
    S.names = false; S.rings = load('rings')==='1'; S.dismissed = load('dis'); S._tripId = load('tripid'); S._cmpId = load('cmpid'); S._roadId = load('roadid'); S.tripMode = load('tmode')||'city'; S.roadRange = +load('rrange')||450;
    renderGuide();
    setTimeout(showGreeting, Math.max(0, S.data.splash_ms||0));
  }
  if(S.data.nonce_ack){ /* لا شيء */ }
  var newAns = S.data.answer ? S.data.answer.id : null;
  var answerChanged = newAns !== S.answerId;
  var nid = S.data.notice ? S.data.notice.id : null; var noticeNew = nid && nid!==S._nid; if(noticeNew) S._nid=nid;
  if(S.busy && (answerChanged || noticeNew)){ S.busy=false; thinkStop(); $('go').classList.remove('busy'); $('go').querySelector('.ms').textContent='arrow_back'; }
  S.answerId=newAns;
  if(noticeNew && S.data.notice.text){ $('gt').textContent='تنبيه'; $('gx').textContent=S.data.notice.text; $('greet').classList.remove('hidden'); setTimeout(function(){ $('greet').classList.add('hidden'); },9000); }
  var hadLoc = !!S.user;
  var tr=S.data.trip, tid=tr?String(tr.id):null;
  if(tid && tid!==S._tripId){ S._tripId=tid; store('tripid',tid); S.tripBusy=false; S.tripShown=true; S.tripMode='city'; store('tmode','city'); S.panel='trip'; S._tripFit=true; }
  var cm=S.data.compare, cid=cm?String(cm.id):null;
  if(cid && cid!==S._cmpId){ S._cmpId=cid; store('cmpid',cid); S.cmp.busy=false; S.cmp.showRes=true; S.cmp.mode=true; S.panel='cmp'; document.body.classList.add('picking'); if(cm.a&&cm.a.pt){ S.cmp.a=cm.a.pt; S.cmp.b=cm.b.pt; } drawCmp(); }
  var rd=S.data.road, rid=rd?String(rd.id):null;
  if(rid && rid!==S._roadId){ S._roadId=rid; store('roadid',rid); S.roadBusy=false; thinkStop(); S.roadShown=true; S.tripMode='road'; store('tmode','road'); S.panel='trip'; S._roadFit=true; }
  if(S.roadBusy && noticeNew){ S.roadBusy=false; thinkStop(); }
  if(S.tripBusy && noticeNew){ S.tripBusy=false; }
  renderTop(); renderRail(); drawUser(); drawRings(); drawMarkers(); drawAnswer(); drawTrip(); drawRoad();
  if(S._roadFit && rd && !rd.error && rd.line){ S._roadFit=false; fitTo(userBounds(rd.line), true); }
  if(S._tripFit && tr && !tr.error && tr.line){ S._tripFit=false; fitTo(userBounds(tr.line), true); }
  if(answerChanged && CA()){
    S.panel='answer'; S.sel=null; S.selLayer.clearLayers();
    var pts=[]; (S.data.answer.routes||[]).forEach(function(r){ r.pts.forEach(function(p){pts.push(p);}); }); (S.data.answer.results||[]).forEach(function(r){ pts.push([r.lat,r.lon]); });
    if(S._geoBounds && S._geoBounds.isValid()){ S.map.fitBounds(S._geoBounds,{padding:[60,60]}); } else fitTo(userBounds(pts), true); $('q').value='';
  } else if(S.panel==='none' && !CA()){ S.panel='none'; }
  var lk = S.data.loc ? S.data.loc.join(',') : '';
  if(lk && lk!==S._lk && !(answerChanged && CA())){ S.map.setView(S.data.loc, 13); }
  S._lk = lk;
  if(first && !lk){ S.map.setView([24.5,45.0],6); }
  if(S.data.focus && S.data.focusId!==S._focusId){ S._focusId=S.data.focusId; var f=S.data.focus; selectPlace(f); }
  renderPanel(); renderStrip();
}
